[package]
name = "sortant"
version = "0.2.2"
edition = "2024"
rust-version = "1.88"
description = "Rank fusion: combine ranked or scored lists with RRF, Borda, CombSUM and more. Deterministic, zero dependencies, no unsafe."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThinkersJournal/sortant"
readme = "README.md"
keywords = ["rank-fusion", "rrf", "search", "ranking", "retrieval"]
categories = ["algorithms", "science"]
publish = false

[dependencies]

[dev-dependencies]
proptest = "1.9"
rankops = "=0.3.0"

[lints.rust]
unsafe_code = "forbid"
